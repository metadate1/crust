name: rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Enforce local-only game-data boundary
        shell: bash
        run: |
          prohibited='(^|/)(local-data|streams)(/|$)|\.(bin|raw|iso|cue|ccd|sub|ecm|chd|cso|img|mdf|mds|nrg|pbp|nsd|nsf|zip|7z|rar|tar|tar\.gz|tgz)$'
          if git ls-files | grep -Eiq "$prohibited"; then
            echo "Tracked game data or archive detected:" >&2
            git ls-files | grep -Ei "$prohibited" >&2
            exit 1
          fi
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.0 --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default 1.97.0
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --locked
      - name: Native release
        run: cargo build --workspace --release --locked
      - name: Wasm release
        run: cargo build --release --locked --target wasm32-unknown-unknown -p crust-web
      - name: Generated browser release
        run: |
          cargo install wasm-bindgen-cli --version 0.2.126 --locked
          npm run build
