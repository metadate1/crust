name: rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.0 --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default 1.97.0
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --locked
      - name: Native release
        run: cargo build --workspace --release --locked
      - name: Wasm release
        run: cargo build --release --locked --target wasm32-unknown-unknown -p crust-web
      - name: Generated browser release
        run: |
          cargo install wasm-bindgen-cli --version 0.2.126 --locked
          npm run build
